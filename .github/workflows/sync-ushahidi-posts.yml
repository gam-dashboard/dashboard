name: Periodic Ushahidi post sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ushahidi-post-sync
  cancel-in-progress: false

jobs:
  sync-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Sync new Ushahidi posts into Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
          USHAHIDI_POSTS_API_URL: https://globalactionmosaic.api.ushahidi.io/api/v5/posts/
        run: npm run sync:ushahidi
